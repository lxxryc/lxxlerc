<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Louís</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            color-scheme: light dark;

            --bg: #f6f6f3;
            --surface: #ffffff;
            --text: #222222;
            --muted: #767676;
            --quote: #444444;
            --line: rgba(0, 0, 0, 0.08);
            --shadow:
                0 12px 35px rgba(0, 0, 0, 0.06),
                0 2px 8px rgba(0, 0, 0, 0.04);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d0d0d;
                --surface: #151515;
                --text: #eeeeee;
                --muted: #9b9b9b;
                --quote: #dddddd;
                --line: rgba(255, 255, 255, 0.09);
                --shadow:
                    0 12px 35px rgba(0, 0, 0, 0.25),
                    0 2px 8px rgba(0, 0, 0, 0.18);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100svh;
            font-family: "Inter", sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: clamp(16px, 0.95rem + 0.2vw, 18px);
            line-height: 1.9;
            letter-spacing: 0.01em;

            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        /* =========================
           PAGE CONTENT
        ========================= */

        main {
            min-height: 100svh;
            overflow-y: auto;

            padding:
                clamp(32px, 8vw, 100px)
                clamp(20px, 6vw, 70px)
                120px;
        }

        main::-webkit-scrollbar {
            display: none;
        }

        article {
            width: min(680px, 100%);
            margin: 0 auto;
        }

        /* =========================
           QUOTE CARD
        ========================= */

        .quote-card {
            position: relative;

            padding: clamp(28px, 5vw, 48px);

            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;

            box-shadow: var(--shadow);
        }

        .quote-mark {
            display: block;

            margin-bottom: 10px;

            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 500;
            line-height: 0.8;

            color: var(--muted);
            opacity: 0.55;
        }

        .quote-text {
            margin: 0;

            color: var(--quote);

            font-size: clamp(1.05rem, 1rem + 0.25vw, 1.2rem);
            font-weight: 400;
            line-height: 1.9;

            text-align: center;
        }

        .quote-author {
            display: block;

            margin-top: 28px;
            padding-top: 18px;

            border-top: 1px solid var(--line);

            color: var(--muted);

            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            position: fixed;
            z-index: 100;

            right: 0;
            bottom: 0;
            left: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 72px;
            padding: 16px 24px;

            background: var(--bg);
            border-top: 1px solid var(--line);

            color: var(--text);

            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.12em;
        }

        #lec {
            pointer-events: none;
        }

        /* =========================
           LOADER
        ========================= */

        #loader {
            position: fixed;
            z-index: 9999;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--bg);

            transition:
                opacity 0.8s ease,
                visibility 0.8s ease;
        }

        #loader.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;

            text-align: center;
        }

        .spinner {
            width: 32px;
            height: 32px;

            border: 2px solid var(--line);
            border-top-color: var(--text);
            border-radius: 50%;

            animation: spin 0.9s linear infinite;
        }

        .loader-content p {
            color: var(--muted);

            font-size: 0.78rem;
            line-height: 1.5;
            letter-spacing: 0.04em;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           COUNTDOWN
        ========================= */

        #countdownScreen {
            position: fixed;
            z-index: 9000;
            inset: 0;

            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 30px;

            background: var(--bg);

            text-align: center;
        }

        #countdownScreen h1 {
            font-size: clamp(2rem, 7vw, 4rem);
            font-weight: 300;
            line-height: 1.2;
            letter-spacing: 0.08em;
        }

        #countdownScreen p {
            margin-top: 18px;

            color: var(--muted);

            font-size: 0.9rem;
        }

        /* =========================
           SELECTION
        ========================= */

        ::selection {
            background: rgba(120, 120, 120, 0.25);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {
            main {
                padding:
                    28px
                    18px
                    105px;
            }

            .quote-card {
                padding: 28px 24px;
                border-radius: 12px;
            }

            .quote-text {
                line-height: 1.8;
            }

            .quote-author {
                margin-top: 24px;
            }

            footer {
                min-height: 64px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         LOADER
    ========================== -->

    <div id="loader" aria-hidden="true">
        <div class="loader-content">
            <div class="spinner"></div>
            <p>Updated • July 2026</p>
        </div>
    </div>


    <!-- =========================
         OPTIONAL COUNTDOWN
    ========================== -->

    <div id="countdownScreen">
        <h1>
            <span id="days">0</span>d
            <span id="hours">00</span>h
            <span id="minutes">00</span>m
            <span id="seconds">00</span>s
        </h1>

        <p>Something is waiting for you.</p>
    </div>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main id="content" hidden>
        <article>

            <section class="quote-card" aria-label="Message from Louís">

                <span class="quote-mark" aria-hidden="true">“</span>

                <p class="quote-text">
                    Whatever you choose to do in this life, let it bring you peace; and
                    if you succeed. Remember to stay humble.
                </p>

                <!--<span class="quote-author">
                    Louís
            </span>-->

            </section>

        </article>
    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>
        <span id="lec">LEC</span>
    </footer>


    <script>
        (() => {
            "use strict";

            /* =========================
               SETTINGS
            ========================== */

            const SETTINGS = {
                countdownEnabled: false,
                unlockDate: new Date(2026, 7, 19, 0, 0, 0),
                minimumLoaderTime: 1000
            };


            /* =========================
               ELEMENTS
            ========================== */

            const loader = document.getElementById("loader");
            const content = document.getElementById("content");
            const countdownScreen = document.getElementById("countdownScreen");

            const days = document.getElementById("days");
            const hours = document.getElementById("hours");
            const minutes = document.getElementById("minutes");
            const seconds = document.getElementById("seconds");


            /* =========================
               SHOW CONTENT
            ========================== */

            function showContent() {
                countdownScreen.style.display = "none";
                content.hidden = false;
            }


            /* =========================
               COUNTDOWN
            ========================== */

            function updateCountdown() {
                const difference = SETTINGS.unlockDate - new Date();

                if (difference <= 0) {
                    showContent();
                    return true;
                }

                const totalSeconds = Math.floor(difference / 1000);

                const remainingDays = Math.floor(
                    totalSeconds / 86400
                );

                const remainingHours = Math.floor(
                    (totalSeconds % 86400) / 3600
                );

                const remainingMinutes = Math.floor(
                    (totalSeconds % 3600) / 60
                );

                const remainingSeconds =
                    totalSeconds % 60;

                days.textContent = remainingDays;
                hours.textContent =
                    String(remainingHours).padStart(2, "0");

                minutes.textContent =
                    String(remainingMinutes).padStart(2, "0");

                seconds.textContent =
                    String(remainingSeconds).padStart(2, "0");

                return false;
            }


            /* =========================
               INITIALIZATION
            ========================== */

            const startTime = performance.now();

            window.addEventListener("load", () => {
                const elapsed = performance.now() - startTime;

                const remainingLoaderTime = Math.max(
                    SETTINGS.minimumLoaderTime - elapsed,
                    0
                );

                setTimeout(() => {
                    loader.classList.add("hide");

                    if (SETTINGS.countdownEnabled) {
                        countdownScreen.style.display = "flex";

                        if (!updateCountdown()) {
                            const countdownInterval = setInterval(() => {
                                if (updateCountdown()) {
                                    clearInterval(countdownInterval);
                                }
                            }, 1000);
                        }
                    } else {
                        showContent();
                    }
                }, remainingLoaderTime);
            });


            /* =========================
               COPY PROTECTION
            ========================== */

            document.addEventListener("copy", event => {
                event.preventDefault();
            });

            document.addEventListener("cut", event => {
                event.preventDefault();
            });
        })();
    </script>

</body>
    </html>
